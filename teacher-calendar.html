<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live classes – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body class="app loading">
  <aside class="side" id="side">
    <a href="index.html" class="side-logo"><img src="images/tn-logo.png" alt="Think Nest home"></a>
    <nav aria-label="Teacher menu">
      <h5 class="first">Teacher</h5>
      <ul><li><a href="teacher-dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a></li><li><a href="teacher-courses.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 8h6M8 12h6"/></svg><span>My Courses</span></a></li><li><a href="teacher-calendar.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Live Classes</span></a></li></ul>
      <h5>Others</h5>
      <ul><li><a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Think Nest website</span></a></li><li><a href="#" id="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4M18 12H9"/></svg><span>Log out</span></a></li></ul>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-bar">
      <button class="side-toggle" id="side-toggle" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <span class="bar-title">Teacher area</span>
      <div class="bar-right"><span class="initials" id="me-initials-small" title="Your profile"></span></div>
    </header>

    <main class="dash">
      <h1 class="dash-h">Live classes</h1>
      <form class="panel inline-form" id="session-form">
        <h3>Add a live class</h3>
        <div class="form-row">
          <label>Course <select name="course_id" required></select></label>
          <label>Title <input type="text" name="title" required placeholder="For example, Week 2: Styling with CSS"></label>
        </div>
        <div class="form-row">
          <label>Date <input type="date" name="date" required></label>
          <label>Start time <input type="time" name="time" step="900" required value="16:00"></label>
          <label>Length <select name="mins"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option></select></label>
        </div>
        <label>Meeting link (Google Meet or Zoom) <input type="url" name="meeting_link" placeholder="https://meet.google.com/..."></label>
        <p class="form-error" id="session-error" role="alert" hidden></p>
        <button class="btn btn-red">Add live class</button>
      </form>
      <h2 class="dash-h">Scheduled</h2>
      <section class="event-list" id="events"><p class="empty">Loading…</p></section>
    </main>

    <footer class="footer app-footer">
      <div class="container footer-inner">
        <img src="images/tn-logo.png" alt="Think Nest" class="footer-logo">
        <div class="footer-middle">
          <ul class="footer-links">
            <li><a href="index.html#about">About Us</a></li>
            <li><a href="index.html#courses">Courses</a></li>
            <li><a href="index.html#paths">Think Paths</a></li>
          </ul>
        </div>
      </div>
      <p class="copyright">Copyright © THINK NEST. All rights reserved.</p>
    </footer>
  </div>
  <div class="side-shade" id="side-shade"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=5"></script>
  <script src="app.js?v=5"></script>
  <script src="teacher.js?v=5"></script>
  <script>startTeacherCalendar();</script>
</body>
</html>
