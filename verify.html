<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a certificate – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=124">
  <link rel="stylesheet" href="app.css?v=124">
  <link rel="stylesheet" href="rtl.css?v=124">
  <script src="i18n.js?v=124"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
      <main class="auth-bg">
    <div class="auth-card">
      <h1>Verify a certificate</h1>
      <p class="auth-sub">Type the code printed at the bottom of a Think Nest certificate to check it’s genuine.</p>
      <form class="auth-form" id="verify-form"><label>Certificate code <input type="text" name="code" maxlength="12" placeholder="For example, 3FA9C21B" autocomplete="off"></label><button class="btn btn-red auth-btn">Check</button></form>
      <div id="verify-out" aria-live="polite"></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=124"></script>
  <script src="app.js?v=124"></script>
  <script src="certs.js?v=124"></script>
  <script>startVerify();</script>
</body>
</html>
