<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent sign up – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="app.css?v=9">
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="parent-login.html" class="not-me">‹ Back to log in</a>
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Create a parent account</h1>
      <p class="auth-sub">After you sign up, add your child with the family code from their account.</p>
      <form class="auth-form" id="psignup-form" novalidate>
        <label>Full name <input type="text" name="full_name" autocomplete="name" required></label>
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Phone number <input type="tel" name="phone" placeholder="+971 ..."></label>
        <label>Password
          <span class="pw"><input type="password" name="password" id="pw1" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
          <button type="button" class="pw-eye" data-eye="pw1" aria-label="Show password">👁</button></span>
        </label>
        <p class="form-error" id="psignup-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-red auth-btn">Create account</button>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=9"></script>
  <script src="app.js?v=9"></script>
  <script src="parent.js?v=9"></script>
  <script>startParentSignup();</script>
</body>
</html>
