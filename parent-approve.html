<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your child’s course request – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=168">
  <link rel="stylesheet" href="app.css?v=168">
  <link rel="stylesheet" href="rtl.css?v=168">
  <script src="i18n.js?v=168"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Your child’s course request</h1>
      <div id="pc-box" aria-live="polite"><p class="auth-sub">Loading…</p></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=168"></script>
  <script src="app.js?v=168"></script>
    <script>
    (async () => {
      const box = document.getElementById('pc-box');
      const tok = new URLSearchParams(location.search).get('t');
      const E = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      if (!tok) { box.innerHTML = '<p class="auth-sub">This link is missing its code. Please open the link from the email again.</p>'; return; }
      const { data, error } = await db.rpc('parent_request_info', { tok });
      const r = data && data[0];
      if (error || !r) { box.innerHTML = '<p class="auth-sub">This link has expired or isn’t valid. Questions? <a href="contact.html">Contact us</a>.</p>'; return; }
      if (r.status !== 'parent') {
        const done = { teacher: '✅ You’ve agreed. The teacher will confirm the place soon.', approved: '✅ The place is confirmed. Thank you!', declined: 'You said no to this course, so it won’t go ahead.', cancelled: 'This request was cancelled.' }[r.status] || 'This request has already been answered.';
        box.innerHTML = `<div class="note big-note">${done}</div>`; return;
      }
      const day = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      box.innerHTML = `<p class="auth-sub"><b>${E(r.child_name)}</b> would like to join this Think Nest course:</p>
        <div class="note"><b>${E(r.course_title)}</b>${r.teacher_name ? '<br>Teacher: ' + E(r.teacher_name) : ''}${r.time_slot ? '<br>Time: ' + E(r.time_slot) : ''}${r.start_date ? '<br>Starts: ' + day(r.start_date) : ''}</div>
        ${r.description ? `<p class="meta">${E(r.description.slice(0, 400))}${r.description.length > 400 ? '…' : ''}</p>` : ''}
        <p class="meta"><a href="course-details.html?id=${r.course_id}" target="_blank" rel="noopener">See all the course details and the teacher’s profile ↗</a> (you may need to log in)</p>
        <p class="form-error" id="pc-err" role="alert" hidden></p>
        <button class="btn btn-red auth-btn" id="pc-yes">✅ I agree</button>
        <p class="switch"><button type="button" class="link-btn" id="pc-no">No, I don’t agree</button></p>`;
      const decide = async ok => {
        const { error: er } = await db.rpc('decide_parent_request', { tok, ok });
        if (er) { const pe = document.getElementById('pc-err'); pe.textContent = 'Sorry, that didn’t work. Please try again in a minute.'; pe.hidden = false; return; }
        box.innerHTML = ok ? `<div class="note big-note">✅ <b>Thank you!</b> The teacher will now confirm ${E(r.child_name)}’s place, and you’ll both be told.</div>
             <p class="auth-sub">Want to follow your child’s progress? <a href="parent-signup.html">Create a free parent account</a>.</p>`
          : `<div class="note big-note">Thank you for letting us know. ${E(r.child_name)} won’t join this course.</div>`;
      };
      document.getElementById('pc-yes').onclick = () => decide(true);
      document.getElementById('pc-no').onclick = () => { if (confirm('Say no to this course?')) decide(false); };
    })();
  </script>/body>
</html>
