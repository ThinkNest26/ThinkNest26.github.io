<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School leader log in – Think Nest for Schools</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=145">
  <link rel="stylesheet" href="app.css?v=145">
  <link rel="stylesheet" href="rtl.css?v=145">
  <script src="i18n.js?v=145"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="schools.html" class="not-me">‹ Back</a>
      <img src="images/tn-bird.png" alt="" class="bird">
      <p class="sreg-kicker">Think Nest for Schools</p>
      <h1>Welcome to your school!</h1>
      <p class="auth-sub">Teachers, leaders and staff: log in with your school email</p>
      <form class="auth-form" id="login-form" novalidate>
        <label>Email <input type="email" name="email" autocomplete="email" placeholder="Enter your email" required></label>
        <label>Password
          <span class="pw"><input type="password" name="password" id="pw" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="pw-eye" data-eye="pw" aria-label="Show password">👁</button></span>
        </label>
        <a href="forgot.html" class="forgot">Forgot password?</a>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <div class="captcha-box" data-captcha></div>
        <button type="submit" class="btn btn-red auth-btn">Log in</button>
        <p class="switch">New school on Think Nest? <a href="school-register.html">Register your school</a></p>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=145"></script>
  <script src="app.js?v=145"></script>
  <script src="captcha.js?v=145"></script>
  <script src="teacher.js?v=145"></script>
  <script>startLoginPage();</script>
  <script>
    (function () {
      const q = new URLSearchParams(location.search), as = q.get('as'), r = q.get('r');
      const NAMES = { principal: 'Principal', deputy: 'Deputy Principal', inclusion: 'Inclusion Lead', subject: 'Subject Coordinator', grade: 'Grade Level Leader', pyp: 'PYP Coordinator', admin: 'School Admin', it: 'IT Team', teacher: 'Teacher', lsa: 'Inclusion Team' };
      const h = document.querySelector('.auth-card h1'), p = document.querySelector('.auth-card .auth-sub'), reg = document.querySelector('.auth-card .switch'), back = document.querySelector('.not-me');
      if (NAMES[r] && h) h.textContent = 'Welcome, ' + NAMES[r] + '!';
      else if (as === 'leader' && h) h.textContent = 'Welcome, School Leader!';
      if (p) p.textContent = 'Log in with your school email';
      if (reg) reg.hidden = !(r === 'principal' || r === 'it' || (as === 'leader' && !r));
      if (back && (as === 'leader' || as === 'staff')) back.setAttribute('href', 'schools.html?g=' + as);
    })();
  </script>
</body>
</html>
