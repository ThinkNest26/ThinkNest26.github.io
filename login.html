<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student log in – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=116">
  <link rel="stylesheet" href="app.css?v=116">
  <link rel="stylesheet" href="rtl.css?v=116">
  <script src="i18n.js?v=116"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="start.html" class="not-me">‹ I’m not a student</a>
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Welcome, Student!</h1>
      <p class="auth-sub">Log in to explore lessons, track your progress, and grow your skills every day</p>
      <form class="auth-form" id="login-form" novalidate>
        <label>Email or username
          <input type="text" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your email or username" required>
        </label>
        <label>Password
          <span class="pw">
            <input type="password" name="password" id="pw" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="pw-eye" data-eye="pw" aria-label="Show password">👁</button>
          </span>
        </label>
        <a href="forgot.html" class="forgot">Forgot password?</a>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <div class="captcha-box" data-captcha></div>
        <button type="submit" class="btn btn-red auth-btn">Log in</button>
        <p class="switch">Don’t have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=116"></script>
  <script src="app.js?v=116"></script>
  <script src="captcha.js?v=116"></script>
  <script>startLoginPage();</script>
</body>
</html>
