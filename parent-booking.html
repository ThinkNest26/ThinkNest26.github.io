<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your child’s mentor session – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=170">
  <link rel="stylesheet" href="app.css?v=170">
  <link rel="stylesheet" href="rtl.css?v=170">
  <script src="i18n.js?v=170"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Your child’s mentor session</h1>
      <div id="pc-box" aria-live="polite"><p class="auth-sub">Loading…</p></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=170"></script>
  <script src="app.js?v=170"></script>
    <script>
    (async () => {
      const box = document.getElementById('pc-box');
      const tok = new URLSearchParams(location.search).get('t');
      const E = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      if (!tok) { box.innerHTML = '<p class="auth-sub">This link is missing its code. Please open the link from the email again.</p>'; return; }
      const { data, error } = await db.rpc('parent_booking_info', { tok });
      const r = data && data[0];
      if (error || !r) { box.innerHTML = '<p class="auth-sub">This link has expired or isn’t valid. Questions? <a href="contact.html">Contact us</a>.</p>'; return; }
      if (r.parent_ok !== false || r.status === 'cancelled') { box.innerHTML = `<div class="note big-note">${r.status === 'cancelled' ? 'This session was cancelled.' : '✅ You’ve already agreed to this session. Thank you!'}</div>`; return; }
      box.innerHTML = `<p class="auth-sub"><b>${E(r.child_name)}</b> asked for a one-to-one mentor session:</p>
        <div class="note"><b>Mentor: ${E(r.mentor_name)}</b>${r.mentor_subject ? '<br>Helps with: ' + E(r.mentor_subject) : ''}<br>When: ${new Date(r.starts_at).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}${r.note ? '<br>Your child wrote: “' + E(r.note) + '”' : ''}</div>
        <p class="meta">🛡️ Mentors agree to Think Nest’s safeguarding rules. Sessions use the mentor’s Think Nest meeting link, you’re welcome to join the call, and you’ll see every message and the mentor’s summary in the session thread.</p>
        <p class="form-error" id="pc-err" role="alert" hidden></p>
        <button class="btn btn-red auth-btn" id="pc-yes">✅ I agree to this session</button>
        <p class="switch"><button type="button" class="link-btn" id="pc-no">No, cancel this session</button></p>`;
      const decide = async ok => {
        const { error: er } = await db.rpc('decide_parent_booking', { tok, ok });
        if (er) { const pe = document.getElementById('pc-err'); pe.textContent = 'Sorry, that didn’t work. Please try again in a minute.'; pe.hidden = false; return; }
        box.innerHTML = ok ? `<div class="note big-note">✅ <b>Thank you!</b> The mentor can now confirm the session. You’ll get the meeting link and a reminder an hour before. You’re welcome to join the call.</div>`
          : `<div class="note big-note">The session has been cancelled, and ${E(r.child_name)} has been told.</div>`;
      };
      document.getElementById('pc-yes').onclick = () => decide(true);
      document.getElementById('pc-no').onclick = () => { if (confirm('Cancel this mentor session?')) decide(false); };
    })();
  </script>/body>
</html>
