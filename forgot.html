<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=106">
  <link rel="stylesheet" href="app.css?v=106">
  <link rel="stylesheet" href="rtl.css?v=106">
  <script src="i18n.js?v=106"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="start.html" class="not-me">‹ Back to log in</a>
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Forgot your password?</h1>
      <p class="auth-sub">Type the email you use for Think Nest and we’ll send you a link to choose a new password.</p>
      <form class="auth-form" id="forgot-form" novalidate>
        <label>Email <input type="email" name="email" autocomplete="email" placeholder="Enter your email" required></label>
        <p class="form-error" id="forgot-error" role="alert" hidden></p>
        <div class="captcha-box" data-captcha></div>
        <button class="btn btn-red auth-btn">Send reset link</button>
        <p class="note" id="forgot-done" hidden>If an account uses that email, a reset link is on its way. Check your inbox, and your spam folder too. The link works for one hour.</p>
      </form>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=106"></script>
  <script src="app.js?v=106"></script>
  <script src="captcha.js?v=106"></script>
  <script>startForgot();</script>
</body>
</html>
