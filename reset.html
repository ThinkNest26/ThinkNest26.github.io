<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=120">
  <link rel="stylesheet" href="app.css?v=120">
  <link rel="stylesheet" href="rtl.css?v=120">
  <script src="i18n.js?v=120"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Choose a new password</h1>
      <p class="auth-sub" id="reset-sub">Checking your reset link…</p>
      <form class="auth-form" id="reset-form" novalidate hidden>
        <label>New password
          <span class="pw"><input type="password" name="password" id="pw1" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
          <button type="button" class="pw-eye" data-eye="pw1" aria-label="Show password">👁</button></span>
        </label>
        <label>Confirm password <input type="password" name="password2" minlength="8" autocomplete="new-password" required></label>
        <p class="form-error" id="reset-error" role="alert" hidden></p>
        <button class="btn btn-red auth-btn">Save new password</button>
      </form>
      <p class="switch" id="reset-again" hidden><a href="forgot.html">Send a new reset link</a></p>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=120"></script>
  <script src="app.js?v=120"></script>
  <script>startReset();</script>
</body>
</html>
