<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schools – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=133">
  <link rel="stylesheet" href="app.css?v=133">
  <link rel="stylesheet" href="rtl.css?v=133">
  <script src="i18n.js?v=133"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="start.html" class="not-me">‹ Back</a>
      <img src="images/tn-icon-school.png" alt="" class="bird">
      <h1>Welcome, school!</h1>
      <p class="auth-sub">Who are you in your school?</p>
      <div class="roles-pick roles-two" role="radiogroup" aria-label="Who are you in your school?">
        <button class="pick" role="radio" aria-checked="false" data-go="school-login.html?as=leader"><img src="images/tn-icon-school.png" alt=""><span>School Leaders</span><small class="pick-sub">Principals, coordinators, heads of department, admin and IT</small></button>
        <button class="pick" role="radio" aria-checked="false" data-go="school-login.html"><img src="images/tn-icon-teacher.png" alt=""><span>School Staff</span><small class="pick-sub">Teachers and the inclusion team</small></button>
      </div>
      <button class="btn btn-red auth-btn" id="next" disabled>Next</button>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=133"></script>
</body>
</html>
