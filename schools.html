<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schools – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=153">
  <link rel="stylesheet" href="app.css?v=153">
  <link rel="stylesheet" href="rtl.css?v=153">
  <script src="i18n.js?v=153"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <a href="start.html" class="not-me">‹ Back</a>
      <img src="images/tn-icon-school.png" alt="" class="bird sch-bird">
      <h1>Welcome, school!</h1>
      <p class="auth-sub">Who are you in your school?</p>
      <div class="roles-pick roles-two" id="sch-pick" role="radiogroup" aria-label="Who are you in your school?">
        <button class="pick" role="radio" aria-checked="false" data-go="schools.html?g=leader"><img src="images/tn-icon-school.png" alt=""><span>School Leaders</span><small class="pick-sub">Principal, inclusion lead, PYP coordinator, school admin and IT</small></button>
        <button class="pick" role="radio" aria-checked="false" data-go="schools.html?g=staff"><img src="images/tn-icon-teacher.png" alt=""><span>School Staff</span><small class="pick-sub">Subject coordinators, grade level leaders, teachers and the inclusion team</small></button>
      </div>
      <button class="btn btn-red auth-btn" id="next" disabled>Next</button>
      <p class="sch-other" id="sch-other" hidden>Another role? <a href="school-login.html">Log in here</a></p>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      const g = new URLSearchParams(location.search).get('g');
      const ROLES = {
        leader: [['principal', '🏫', 'School principal'], ['inclusion', '🧩', 'Inclusion lead'], ['pyp', '🌍', 'PYP coordinator'], ['admin', '🗂️', 'School admin'], ['it', '💻', 'IT']],
        staff: [['subject', '📚', 'Subject coordinator'], ['grade', '🎓', 'Grade level leader'], ['teacher', '👩‍🏫', 'Teacher'], ['lsa', '🤝', 'Inclusion team (LSA)']] };
      if (!ROLES[g]) return;
      document.querySelector('.auth-card h1').textContent = g === 'leader' ? 'School Leaders' : 'School Staff';
      document.querySelector('.auth-card .auth-sub').textContent = 'Choose your role';
      document.querySelector('.not-me').setAttribute('href', 'schools.html');
      const pick = document.getElementById('sch-pick');
      pick.className = 'roles-pick roles-pick-' + ROLES[g].length;
      pick.innerHTML = ROLES[g].map(([r, ic, l]) => `<button class="pick" role="radio" aria-checked="false" data-go="school-login.html?as=${g}&r=${r}"><span class="pick-emoji" aria-hidden="true">${ic}</span><span>${l}</span></button>`).join('');
      document.getElementById('sch-other').hidden = false;
    })();
  </script>
  <script src="app.js?v=153"></script>
</body>
</html>
