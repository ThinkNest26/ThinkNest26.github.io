<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="app.css?v=12">
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Welcome to Think Nest!</h1>
      <p class="auth-sub">Start by choosing your role</p>
      <div class="roles-pick" role="radiogroup" aria-label="Choose your role">
        <button class="pick" role="radio" aria-checked="false" data-go="login.html"><img src="images/tn-icon-student.png" alt=""><span>Student</span></button>
        <button class="pick" role="radio" aria-checked="false" data-go="parent-login.html"><img src="images/tn-icon-parent.png" alt=""><span>Parent</span></button>
        <button class="pick" role="radio" aria-checked="false" data-go="teacher-login.html"><img src="images/tn-icon-teacher.png" alt=""><span>Teacher</span></button>
        <button class="pick" role="radio" aria-checked="false" data-soon="School leader accounts"><img src="images/tn-icon-school.png" alt=""><span>School Leader</span></button>
        <button class="pick" role="radio" aria-checked="false" data-go="admin-login.html"><span class="pick-ic" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 6l22 8v16c0 14-9.5 23-22 28C19.5 53 10 44 10 30V14z" fill="#3E4B94"/><path d="M32 12l16 6v12c0 10.5-7 17.5-16 21.5C23 47.5 16 40.5 16 30V18z" fill="#8FB4E3"/><path d="M23 31l6 6 12-13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Admin</span></button>
      </div>
      <button class="btn btn-red auth-btn" id="next" disabled>Next</button>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=12"></script>
</body>
</html>
