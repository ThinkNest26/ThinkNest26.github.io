  <meta property="og:url" content="https://thinknestonline.com/parent-consent.html">

  <meta name="twitter:title" content="Confirm your child’s account – Think Nest">

</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Confirm your child’s account</h1>
      <div id="pc-box" aria-live="polite"><p class="auth-sub">Loading…</p></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=171"></script>
  <script src="app.js?v=183"></script>
  <script>
    (async () => {
      const box = document.getElementById('pc-box');
      const tok = new URLSearchParams(location.search).get('t');
      const E = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
      if (!tok) { box.innerHTML = '<p class="auth-sub">This link is missing its code. Please open the link from the email again.</p>'; return; }
      const { data, error } = await db.rpc('parent_consent_info', { tok });
      const info = data && data[0];
      if (error || !info) { box.innerHTML = '<p class="auth-sub">This link has expired or isn’t valid. If you didn’t expect this email, you can ignore it. Questions? <a href="contact.html">Contact us</a>.</p>'; return; }
      if (info.status !== 'waiting') {
        box.innerHTML = `<div class="note big-note">${info.status === 'confirmed' ? '✅ You’ve already confirmed ' + E(info.child_name) + '’s account. Thank you!' : 'You told us this wasn’t you, so this account won’t be used.'}</div>`; return;
      }
      box.innerHTML = `<p class="auth-sub"><b>${E(info.child_name)}</b> signed up for Think Nest and gave your email as their parent or guardian.</p>
        <div class="note">${E([info.grade, info.curriculum].filter(Boolean).join(' · '))}${info.child_email ? '<br>Account email: ' + E(info.child_email) : ''}</div>
        <p class="meta">Think Nest is an online learning platform with courses, classes and a moderated community. Teachers and students don’t chat privately, and you can follow your child’s progress with a free parent account.</p>
        <label class="remember agree-box"><input type="checkbox" id="pc-ok"> <span>I am ${E(info.child_name)}’s parent or guardian, and I agree to them using Think Nest. I have read the <a href="privacy.html" target="_blank" rel="noopener">privacy notice</a> and <a href="terms.html" target="_blank" rel="noopener">terms of use</a>.</span></label>
        <p class="form-error" id="pc-err" role="alert" hidden></p>
        <button class="btn btn-red auth-btn" id="pc-yes">Confirm my child’s account</button>
        <p class="switch"><button type="button" class="link-btn" id="pc-no">This wasn’t me / I don’t agree</button></p>`;
      const decide = async ok => {
        const { error: er } = await db.rpc('decide_parent_consent', { tok, ok });
        if (er) { const pe = document.getElementById('pc-err'); pe.textContent = 'Sorry, that didn’t work. Please try again in a minute.'; pe.hidden = false; return; }
        box.innerHTML = ok
          ? `<div class="note big-note">✅ <b>Thank you!</b> You’ve confirmed ${E(info.child_name)}’s account. The Think Nest team will finish checking it soon.</div>
             <p class="auth-sub">Want to follow their courses, progress and certificates? <a href="parent-signup.html">Create a free parent account</a>.</p>`
          : '<div class="note big-note">Thank you for telling us. This account won’t be approved. If you think a child is using your email by mistake, <a href="contact.html">contact us</a>.</div>';
      };
      document.getElementById('pc-yes').onclick = () => { if (!document.getElementById('pc-ok').checked) { const pe = document.getElementById('pc-err'); pe.textContent = 'Please tick the box to confirm.'; pe.hidden = false; return; } decide(true); };
      document.getElementById('pc-no').onclick = () => { if (confirm('Tell Think Nest this wasn’t you, so the account isn’t approved?')) decide(false); };
    })();
  </script>
</body>
</html>
