<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Think Nest for Schools is now Nestopia</title>
<link rel="icon" href="images/tn-logo.png">
<style>
:root{color-scheme:light dark;--bg:#F7F5FB;--card:#fff;--ink:#2B2340;--muted:#6B6480;--btn:#33405A;--line:#E6E1EF}
@media (prefers-color-scheme: dark){:root{--bg:#16131D;--card:#221D2B;--ink:#F1ECF7;--muted:#B2A8C2;--btn:#C9D6EE;--line:#382F45}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Raleway,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px;text-align:center}
img{height:44px;width:auto}
h1{font-size:26px;margin:18px 0 10px}
p{color:var(--muted);line-height:1.6;margin:0 0 22px}
a.btn{display:inline-block;background:var(--btn);color:var(--card);text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px}
a.home{display:block;margin-top:18px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
<img src="images/tn-logo.png" alt="Think Nest">
<h1>Think Nest for Schools is now Nestopia</h1>
<p>Everything for schools (school setup, staff, planning, observations and student progress) now lives on Nestopia, our dedicated platform for schools.</p>
<a class="btn" href="https://nestopia.school/">Go to Nestopia</a>
<a class="home" href="index.html">Back to Think Nest</a>
</main>
</body>
</html>
