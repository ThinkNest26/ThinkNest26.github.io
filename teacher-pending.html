<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waiting for approval – Think Nest</title>
  <link rel="icon" href="images/tn-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=152">
  <link rel="stylesheet" href="app.css?v=152">
  <link rel="stylesheet" href="rtl.css?v=152">
  <script src="i18n.js?v=152"></script>
</head>
<body class="auth">
  <header class="app-top">
    <a href="index.html"><img src="images/tn-logo-dark.png" alt="Think Nest home" class="app-top-logo"></a>
    <a href="index.html" class="app-exit">Exit</a>
  </header>
  <main class="auth-bg">
    <div class="auth-card">
      <img src="images/tn-bird.png" alt="" class="bird">
      <h1>Thanks! Your request is being checked</h1>
      <p class="auth-sub">Think Nest will approve your teacher account soon. Once it’s approved, log in again to open the teacher area.</p>
      <div class="step-buttons narrow"><a href="index.html" class="btn btn-white auth-btn outline">Back to website</a><button class="btn btn-red auth-btn" id="logout-btn">Log out</button></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=152"></script>
  <script src="app.js?v=152"></script>
  <script src="teacher.js?v=152"></script>
  <script>document.getElementById("logout-btn").addEventListener("click", async () => { await db.auth.signOut(); location.href = "index.html"; });</script>
</body>
</html>
